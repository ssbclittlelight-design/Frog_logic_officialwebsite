<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrogLogic | AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;900&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            background-image: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.12) 0%, #050505 70%);
            background-attachment: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Pure CSS Digital Certificate */
        .digital-cert {
            background: #fffdfa;
            color: #1a1a1a;
            padding: 2.5rem 1.5rem;
            border: 10px double #c5a059;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            max-width: 500px;
            margin: 0 auto;
        }
        .cert-title { font-family: 'Playfair Display', serif; letter-spacing: 2px; }
        .cert-script { font-family: 'Dancing Script', cursive; font-size: 2rem; border-bottom: 1px solid #999; display: inline-block; padding: 0 1rem; line-height: 1.2; }

        .frog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .game-cell { 
            aspect-ratio: 1/1; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2.5rem; border-radius: 12px; cursor: pointer;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .active-frog { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.5); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const apiKey = ""; 

        function App() {
            const [tab, setTab] = useState('home');

            return (
                <div className="min-h-screen flex flex-col relative pb-20">
                    <div className="fixed top-6 left-1/2 -translate-x-1/2 w-[95%] max-w-lg z-50">
                        <nav className="glass rounded-full px-2 py-2 flex justify-between items-center shadow-2xl overflow-hidden">
                            <div className="flex items-center pl-3 gap-1 font-black text-xs sm:text-sm tracking-tighter">
                                <span className="drop-shadow-[0_0_8px_rgba(34,197,94,0.8)]">🐸</span> FROGLOGIC
                            </div>
                            <div className="flex gap-0.5 overflow-x-auto no-scrollbar">
                                <NavButton label="Home" active={tab === 'home'} onClick={() => setTab('home')} />
                                <NavButton label="Games" active={tab === 'games'} onClick={() => setTab('games')} />
                                <NavButton label="Vault" active={tab === 'vault'} onClick={() => setTab('vault')} />
                                <NavButton label="✨ Oracle" active={tab === 'oracle'} onClick={() => setTab('oracle')} />
                            </div>
                        </nav>
                    </div>

                    <main className="flex-grow w-full max-w-4xl mx-auto pt-32 px-4">
                        {tab === 'home' && <Home />}
                        {tab === 'games' && <Games />}
                        {tab === 'vault' && <Vault />}
                        {tab === 'oracle' && <Oracle />}
                    </main>
                </div>
            );
        }

        function NavButton({ label, active, onClick }) {
            return (
                <button onClick={onClick} className={`px-3 py-1.5 rounded-full text-[10px] font-bold transition-all whitespace-nowrap ${active ? 'bg-green-500 text-black shadow-lg' : 'text-gray-400 hover:text-white'}`}>
                    {label}
                </button>
            );
        }

        function Home() {
            return (
                <div className="flex flex-col items-center justify-center pt-6 animate-in fade-in slide-in-from-bottom-4">
                    <div className="glass p-6 rounded-full border-green-500/30 mb-8 shadow-xl">
                        <span className="text-7xl">🐸</span>
                    </div>
                    <h1 className="text-5xl sm:text-6xl font-black mb-2 text-center bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">
                        FROG<span className="text-green-500">LOGIC</span>
                    </h1>
                    <p className="text-gray-400 text-lg mb-12 text-center font-light">The Logical Choice.</p>
                    <div className="flex flex-col gap-3 w-full max-w-xs">
                        <a href="https://youtube.com/@froglogicyt" target="_blank" className="bg-red-600 p-4 rounded-xl text-center font-bold shadow-lg active:scale-95 transition">YouTube</a>
                        <a href="https://discord.gg/jYyyTj6Ak" target="_blank" className="bg-indigo-600 p-4 rounded-xl text-center font-bold shadow-lg active:scale-95 transition">Discord</a>
                    </div>
                </div>
            );
        }

        // --- AI LOGIC ---
        async function getAILore(topic) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Topic: ${topic}` }] }],
                        systemInstruction: { parts: [{ text: "You are the FrogLogic Oracle. Write 2 paragraphs of logical lore about the community and Derpy Vandals. Be high-energy." }] }
                    })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (e) { return "The logic flow was interrupted. Try again."; }
        }

        function Oracle() {
            const [query, setQuery] = useState('');
            const [result, setResult] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAsk = async () => {
                if(!query) return;
                setLoading(true);
                const lore = await getAILore(query);
                setResult(lore);
                setLoading(false);
            };

            return (
                <div className="animate-in fade-in slide-in-from-bottom-6 max-w-md mx-auto pb-10">
                    <h2 className="text-3xl font-black text-center mb-6">AI ORACLE</h2>
                    <div className="glass rounded-3xl p-6 mb-6">
                        <input className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 mb-4 outline-none focus:border-green-500" placeholder="Ask for Lore..." value={query} onChange={e=>setQuery(e.target.value)} />
                        <button onClick={handleAsk} disabled={loading} className="w-full bg-green-500 text-black font-black py-3 rounded-xl disabled:opacity-50">
                            {loading ? "PROCESSING..." : "GENERATE LORE"}
                        </button>
                    </div>
                    {result && <div className="glass rounded-3xl p-6 text-sm text-gray-300 leading-relaxed animate-in zoom-in-95">{result}</div>}
                </div>
            );
        }

        function Vault() {
            return (
                <div className="animate-in fade-in slide-in-from-bottom-6 pb-10">
                    <h2 className="text-3xl font-black text-center mb-8 uppercase tracking-widest">The Vault</h2>
                    <div className="digital-cert text-center rounded-sm">
                        <h3 className="cert-title text-3xl font-bold mb-8">ADOPTION</h3>
                        <div className="space-y-4">
                            <p className="italic text-gray-600 text-sm">This certifies that</p>
                            <span className="cert-script">FrogLogic</span>
                            <p className="italic text-gray-600 text-sm">has officially adopted</p>
                            <span className="cert-script text-2xl">"Derpy Vandals"</span>
                        </div>
                        <p className="mt-8 px-4 text-[10px] text-gray-500 italic">I promise to give them the lifetime of love and care they deserve.</p>
                        <div className="mt-10 flex justify-between px-4 border-t border-gray-200 pt-4">
                            <div className="text-left"><span className="cert-script text-lg border-none">FrogLogic</span><p className="text-[8px] font-bold text-gray-400">SIGNATURE</p></div>
                            <div className="text-right"><span className="font-bold text-gray-800 text-xs">MAY 2nd, 2007</span><p className="text-[8px] font-bold text-gray-400">DATE ISSUED</p></div>
                        </div>
                    </div>
                </div>
            );
        }

        function Games() {
            const [score, setScore] = useState(0);
            const [pos, setPos] = useState(null);
            const [active, setActive] = useState(false);

            const start = () => { setScore(0); setActive(true); setPos(Math.floor(Math.random()*9)); setTimeout(() => setActive(false), 30000); };

            return (
                <div className="max-w-xs mx-auto animate-in zoom-in-95">
                    <div className="flex justify-between mb-6 font-black text-green-500">
                        <span>30s CATCH</span>
                        <span>SCORE: {score}</span>
                    </div>
                    <div className="glass p-4 rounded-3xl min-h-[350px] flex flex-col justify-center">
                        {!active ? (
                            <div className="text-center">
                                {score > 0 && <p className="mb-4 text-xl">Final Score: {score}</p>}
                                <button onClick={start} className="bg-green-500 text-black font-black px-8 py-3 rounded-full">START</button>
                            </div>
                        ) : (
                            <div className="frog-grid">
                                {[...Array(9)].map((_, i) => (
                                    <div key={i} onClick={() => i === pos && (setScore(s=>s+1), setPos(Math.floor(Math.random()*9)))} className={`game-cell ${i === pos ? 'active-frog' : ''}`}>
                                        {i === pos && <span>🐸</span>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
