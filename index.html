<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrogLogic | AI-Powered Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            background-image: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.15) 0%, #050505 50%);
            background-attachment: fixed;
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .digital-cert {
            background: #fff9f0;
            color: #1a1a1a;
            padding: 3rem 2rem;
            border: 12px double #c5a059;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .cert-title { font-family: 'Playfair Display', serif; letter-spacing: 2px; }
        .cert-script { font-family: 'Dancing Script', cursive; font-size: 2.2rem; border-bottom: 1px solid #999; display: inline-block; padding: 0 1rem; line-height: 1; }

        .frog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .game-cell { 
            aspect-ratio: 1/1; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 3rem; border-radius: 16px; cursor: pointer; transition: all 0.2s;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .game-cell:active { transform: scale(0.92); }
        .game-cell.active-frog { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.5); }
        
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 5px rgba(34, 197, 94, 0.2); }
            50% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.6); }
        }
        .ai-glow { animation: pulse-green 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const apiKey = ""; // Provided by environment

        function App() {
            const [tab, setTab] = useState('home');

            return (
                <div className="min-h-screen flex flex-col relative pb-20">
                    <div className="fixed top-6 left-1/2 -translate-x-1/2 w-[95%] max-w-lg z-50">
                        <nav className="glass rounded-full px-2 py-2 flex justify-between items-center shadow-2xl">
                            <div className="flex items-center pl-3 gap-1 font-black text-sm sm:text-base tracking-wider text-white">
                                <span className="drop-shadow-[0_0_8px_rgba(34,197,94,0.8)]">🐸</span> FROGLOGIC
                            </div>
                            <div className="flex gap-1 overflow-x-auto">
                                <NavButton label="Home" active={tab === 'home'} onClick={() => setTab('home')} />
                                <NavButton label="Games" active={tab === 'games'} onClick={() => setTab('games')} />
                                <NavButton label="Vault" active={tab === 'vault'} onClick={() => setTab('vault')} />
                                <NavButton label="✨ Oracle" active={tab === 'oracle'} onClick={() => setTab('oracle')} />
                            </div>
                        </nav>
                    </div>

                    <main className="flex-grow w-full max-w-5xl mx-auto pt-32 px-4">
                        {tab === 'home' && <Home />}
                        {tab === 'games' && <Games />}
                        {tab === 'vault' && <Vault />}
                        {tab === 'oracle' && <Oracle />}
                    </main>
                </div>
            );
        }

        function NavButton({ label, active, onClick }) {
            return (
                <button 
                    onClick={onClick} 
                    className={`px-3 sm:px-4 py-2 rounded-full text-[10px] sm:text-xs font-bold transition-all whitespace-nowrap ${active ? 'bg-green-500 text-black shadow-[0_0_15px_rgba(34,197,94,0.4)]' : 'text-gray-400 hover:text-white'}`}
                >
                    {label}
                </button>
            );
        }

        function Home() {
            return (
                <div className="flex flex-col items-center justify-center pt-10 animate-in fade-in slide-in-from-bottom-4">
                    <div className="glass p-6 rounded-full border-green-500/30 mb-8 ai-glow">
                        <span className="text-7xl sm:text-8xl">🐸</span>
                    </div>
                    <h1 className="text-5xl sm:text-7xl font-black mb-4 tracking-tighter text-center bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">
                        FROG<span className="text-green-500">LOGIC</span>
                    </h1>
                    <p className="text-gray-400 text-lg mb-12 text-center font-light italic">Undeniably Logical.</p>
                    <div className="flex flex-col gap-4 w-full max-w-xs">
                        <a href="https://youtube.com/@froglogicyt" target="_blank" className="bg-red-600 p-4 rounded-2xl text-center font-bold shadow-lg active:scale-95 transition">YouTube</a>
                        <a href="https://discord.gg/jYyyTj6Ak" target="_blank" className="bg-indigo-600 p-4 rounded-2xl text-center font-bold shadow-lg active:scale-95 transition">Discord</a>
                    </div>
                </div>
            );
        }

        // --- GEMINI API HELPERS ---
        async function callGemini(prompt) {
            let retries = 0;
            const delay = (ms) => new Promise(res => setTimeout(res, ms));
            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: "You are the FrogLogic Oracle. You write lore and answer questions about the FrogLogic community with a tone that is logical, slightly mysterious, and highly respectful of the community's history (Derpy Vandals, etc.). Keep lore entries around 150-200 words." }] }
                        })
                    });
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) {
                    retries++;
                    await delay(Math.pow(2, retries) * 1000);
                }
            }
            throw new Error("Failed after retries");
        }

        async function speakLore(text) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say in a wise, logical tone: ${text}` }] }],
                        generationConfig: { 
                            responseModalities: ["AUDIO"], 
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } 
                        }
                    })
                });
                const data = await response.json();
                const pcmData = data.candidates[0].content.parts[0].inlineData.data;
                playAudio(pcmData);
            } catch (err) {
                console.error("TTS Error", err);
            }
        }

        function playAudio(base64Data) {
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            
            // Convert PCM16 to WAV
            const sampleRate = 24000;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            view.setUint32(0, 0x52494646, false); // "RIFF"
            view.setUint32(4, 36 + bytes.length, true);
            view.setUint32(8, 0x57415645, false); // "WAVE"
            view.setUint32(12, 0x666d7420, false); // "fmt "
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, 1, true); // Mono
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false); // "data"
            view.setUint32(40, bytes.length, true);

            const blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
        }

        function Oracle() {
            const [input, setInput] = useState('');
            const [lore, setLore] = useState('');
            const [loading, setLoading] = useState(false);
            const [speaking, setSpeaking] = useState(false);

            const generateLore = async () => {
                if (!input.trim()) return;
                setLoading(true);
                try {
                    const result = await callGemini(`Generate logical lore for: ${input}`);
                    setLore(result);
                } catch (e) {
                    setLore("The logic flow is blocked. Please try again.");
                }
                setLoading(false);
            };

            const handleSpeak = async () => {
                setSpeaking(true);
                await speakLore(lore);
                setSpeaking(false);
            };

            return (
                <div className="animate-in fade-in slide-in-from-bottom-8 max-w-xl mx-auto pb-10">
                    <div className="text-center mb-8">
                        <h2 className="text-4xl font-black mb-2">THE ✨ ORACLE</h2>
                        <p className="text-green-500 text-sm font-bold tracking-widest uppercase">AI Lore Weaver</p>
                    </div>

                    <div className="glass rounded-[2rem] p-6 mb-6">
                        <p className="text-gray-400 text-sm mb-4">Input a topic to expand the FrogLogic universe.</p>
                        <div className="flex flex-col gap-3">
                            <input 
                                type="text" 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Example: The Legend of the Green Pond"
                                className="bg-black/50 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-green-500 transition-colors"
                            />
                            <button 
                                onClick={generateLore}
                                disabled={loading}
                                className="bg-green-500 text-black font-black py-3 rounded-xl disabled:opacity-50 hover:scale-[1.02] transition-transform"
                            >
                                {loading ? "ANALYZING LOGIC..." : "✨ GENERATE LORE"}
                            </button>
                        </div>
                    </div>

                    {lore && (
                        <div className="glass rounded-[2rem] p-6 animate-in zoom-in-95">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-green-500 uppercase text-xs tracking-widest">Oracle Response</h3>
                                <button 
                                    onClick={handleSpeak}
                                    disabled={speaking}
                                    className="p-2 bg-white/5 rounded-full hover:bg-white/10 text-xl"
                                    title="Speak Lore"
                                >
                                    {speaking ? "⏳" : "🔊"}
                                </button>
                            </div>
                            <div className="text-gray-300 leading-relaxed text-sm whitespace-pre-wrap font-light">
                                {lore}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Games() {
            const [game, setGame] = useState('catch');
            return (
                <div className="animate-in zoom-in-95">
                    <div className="flex justify-center gap-2 mb-8 bg-white/5 p-1 rounded-full max-w-[280px] mx-auto border border-white/10">
                        <button onClick={() => setGame('catch')} className={`flex-1 py-2 rounded-full text-xs font-bold ${game === 'catch' ? 'bg-green-500 text-black' : 'text-gray-400'}`}>Catch</button>
                        <button onClick={() => setGame('ttt')} className={`flex-1 py-2 rounded-full text-xs font-bold ${game === 'ttt' ? 'bg-green-500 text-black' : 'text-gray-400'}`}>TicTacToe</button>
                    </div>
                    <div className="glass rounded-[2.5rem] p-6 max-w-md mx-auto min-h-[480px] flex flex-col justify-center">
                        {game === 'catch' ? <CatchFrog /> : <TicTacToe />}
                    </div>
                </div>
            );
        }

        function CatchFrog() {
            const [score, setScore] = useState(0);
            const [pos, setPos] = useState(null);
            const [timeLeft, setTimeLeft] = useState(60);
            const [status, setStatus] = useState('idle'); 
            const timer = useRef(null);

            const start = () => {
                setScore(0); setTimeLeft(60); setStatus('playing'); setPos(Math.floor(Math.random()*9));
                timer.current = setInterval(() => {
                    setTimeLeft(p => { if(p <= 1) { clearInterval(timer.current); setStatus('end'); return 0; } return p - 1; });
                }, 1000);
            };

            if (status === 'idle') return <div className="text-center"><button onClick={start} className="bg-green-500 text-black font-black py-4 px-10 rounded-full">START GAME</button></div>;
            if (status === 'end') return <div className="text-center"><h2 className="text-6xl font-black mb-8">{score}</h2><button onClick={start} className="glass px-8 py-3 rounded-full">PLAY AGAIN</button></div>;

            return (
                <div className="w-full">
                    <div className="flex justify-between mb-8 px-4 font-black">
                        <span className={timeLeft <= 10 ? 'text-red-500 animate-pulse' : ''}>{timeLeft}s</span>
                        <span className="text-green-500">SCORE: {score}</span>
                    </div>
                    <div className="frog-grid">
                        {[...Array(9)].map((_, i) => (
                            <div key={i} onClick={() => i === pos && (setScore(s=>s+1), setPos(Math.floor(Math.random()*9)))} className={`game-cell ${i === pos ? 'active-frog' : ''}`}>
                                {i === pos && <span className="frog-emoji">🐸</span>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function TicTacToe() {
            const [b, setB] = useState(Array(9).fill(null));
            const [x, setX] = useState(true);
            const win = ((s) => {
                const l = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                for (let [a,b,c] of l) if (s[a] && s[a] === s[b] && s[a] === s[c]) return s[a];
                return null;
            })(b);

            return (
                <div className="text-center">
                    <div className="mb-8 font-bold">{win ? `Winner: ${win}` : `Turn: ${x ? 'X' : 'O'}`}</div>
                    <div className="frog-grid">
                        {b.map((v, i) => (
                            <div key={i} onClick={() => !win && !b[i] && setB(prev => {const n=[...prev]; n[i]=x?'X':'O'; setX(!x); return n;})} className="game-cell font-black">
                                <span className={v === 'X' ? 'text-blue-400' : 'text-pink-400'}>{v}</span>
                            </div>
                        ))}
                    </div>
                    <button onClick={() => setB(Array(9).fill(null))} className="mt-8 text-xs text-gray-500 font-bold uppercase tracking-widest">Reset</button>
                </div>
            );
        }

        function Vault() {
            return (
                <div className="animate-in fade-in slide-in-from-bottom-8 max-w-xl mx-auto pb-10">
                    <div className="text-center mb-10">
                        <h2 className="text-4xl font-black mb-2">OFFICIAL VAULT</h2>
                        <p className="text-green-500 text-sm font-bold tracking-widest uppercase">Certified Records</p>
                    </div>
                    
                    <div className="digital-cert text-center rounded-sm">
                        <p className="text-[10px] font-bold text-gray-500 uppercase tracking-[0.3em] mb-2">Certificate of</p>
                        <h3 className="cert-title text-4xl font-bold mb-10">ADOPTION</h3>
                        
                        <div className="space-y-6">
                            <p className="italic text-gray-600 font-serif">This certifies that</p>
                            <span className="cert-script min-w-[200px]">FrogLogic</span>
                            
                            <p className="italic text-gray-600 font-serif">has officially adopted</p>
                            <span className="cert-script min-w-[250px] text-3xl">"Derpy Vandals"</span>
                        </div>
                        
                        <p className="mt-12 px-6 text-[11px] leading-relaxed text-gray-600 font-serif italic">
                            By signing this certificate, I promise to give them the lifetime of 
                            love, care, and attention that they deserve. I promise to do my 
                            best to protect them and help them live a happy and healthy life.
                        </p>
                        
                        <div className="mt-14 flex justify-between px-6 border-t border-gray-200 pt-4">
                            <div className="text-left">
                                <span className="cert-script text-xl border-none p-0">FrogLogic</span>
                                <p className="text-[9px] uppercase font-bold text-gray-400">Signature</p>
                            </div>
                            <div className="text-right">
                                <span className="font-bold text-gray-800 text-sm">MAY 2nd, 2007</span>
                                <p className="text-[9px] uppercase font-bold text-gray-400">Date Issued</p>
                            </div>
                        </div>
                        
                        <div className="absolute -bottom-4 -right-4 w-20 h-20 bg-[#d4af37] rounded-full border-4 border-white flex items-center justify-center shadow-xl rotate-12">
                            <span className="text-white text-xs font-black text-center leading-none">OFFICIAL<br/>LOGIC</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
