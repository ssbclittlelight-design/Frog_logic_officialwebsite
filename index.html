<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrogLogic | AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;900&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            background-image: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.12) 0%, #050505 70%);
            background-attachment: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Certificate Styling to match IMG_1481 */
        .digital-cert {
            background: #ffffff;
            color: #000000;
            padding: 3rem 2rem;
            border: 1px solid #e5e5e5;
            position: relative;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .cert-header { font-family: 'EB Garamond', serif; letter-spacing: 3px; font-size: 0.8rem; font-weight: 500; color: #666; }
        .cert-main-title { font-family: 'EB Garamond', serif; font-size: 4.5rem; line-height: 1; margin: 1rem 0 2.5rem 0; font-weight: 400; letter-spacing: 2px; }
        .cert-body-text { font-family: 'EB Garamond', serif; font-size: 1.1rem; color: #333; margin-bottom: 2rem; line-height: 1.6; }
        .cert-handwriting { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: #000; display: inline-block; padding: 0 0.5rem; line-height: 0.8; }
        .cert-line { border-bottom: 1px solid #000; display: inline-block; margin: 0 5px; }
        .cert-footer-label { font-family: 'EB Garamond', serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; border-top: 1px solid #000; padding-top: 4px; display: inline-block; width: 100%; color: #000; }

        .frog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .game-cell { 
            aspect-ratio: 1/1; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2.5rem; border-radius: 12px; cursor: pointer;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .active-frog { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const apiKey = ""; 

        function App() {
            const [tab, setTab] = useState('home');

            return (
                <div className="min-h-screen flex flex-col relative pb-20">
                    <div className="fixed top-6 left-1/2 -translate-x-1/2 w-[95%] max-w-lg z-50">
                        <nav className="glass rounded-full px-2 py-2 flex justify-between items-center shadow-2xl overflow-hidden">
                            <div className="flex items-center pl-3 gap-1 font-black text-xs sm:text-sm tracking-tighter">
                                <span className="drop-shadow-[0_0_8px_rgba(34,197,94,0.8)]">🐸</span> FROGLOGIC
                            </div>
                            <div className="flex gap-0.5 overflow-x-auto no-scrollbar">
                                <NavButton label="Home" active={tab === 'home'} onClick={() => setTab('home')} />
                                <NavButton label="Games" active={tab === 'games'} onClick={() => setTab('games')} />
                                <NavButton label="Vault" active={tab === 'vault'} onClick={() => setTab('vault')} />
                                <NavButton label="✨ Oracle" active={tab === 'oracle'} onClick={() => setTab('oracle')} />
                            </div>
                        </nav>
                    </div>

                    <main className="flex-grow w-full max-w-4xl mx-auto pt-32 px-4">
                        {tab === 'home' && <Home />}
                        {tab === 'games' && <Games />}
                        {tab === 'vault' && <Vault />}
                        {tab === 'oracle' && <Oracle />}
                    </main>
                </div>
            );
        }

        function NavButton({ label, active, onClick }) {
            return (
                <button onClick={onClick} className={`px-3 py-1.5 rounded-full text-[10px] font-bold transition-all whitespace-nowrap ${active ? 'bg-green-500 text-black shadow-lg' : 'text-gray-400 hover:text-white'}`}>
                    {label}
                </button>
            );
        }

        function Home() {
            return (
                <div className="flex flex-col items-center justify-center pt-6 animate-in fade-in slide-in-from-bottom-4">
                    <div className="glass p-6 rounded-full border-green-500/30 mb-8 shadow-xl">
                        <span className="text-7xl">🐸</span>
                    </div>
                    <h1 className="text-5xl sm:text-6xl font-black mb-2 text-center bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">
                        FROG<span className="text-green-500">LOGIC</span>
                    </h1>
                    <p className="text-gray-400 text-lg mb-12 text-center font-light italic">"The Logical choice since 2007."</p>
                    <div className="flex flex-col gap-3 w-full max-w-xs">
                        <a href="https://youtube.com/@froglogicyt" target="_blank" className="bg-red-600 p-4 rounded-xl text-center font-bold shadow-lg active:scale-95 transition">YouTube</a>
                        <a href="https://discord.gg/jYyyTj6Ak" target="_blank" className="bg-indigo-600 p-4 rounded-xl text-center font-bold shadow-lg active:scale-95 transition">Discord</a>
                    </div>
                </div>
            );
        }

        async function getAILore(topic) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Topic: ${topic}` }] }],
                        systemInstruction: { parts: [{ text: "You are the FrogLogic Oracle. Write 2 paragraphs of logical lore about the community and Derpy Vandals. Use a professional but energetic tone." }] }
                    })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (e) { return "The logic flow was interrupted. Check your connection."; }
        }

        function Oracle() {
            const [query, setQuery] = useState('');
            const [result, setResult] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAsk = async () => {
                if(!query) return;
                setLoading(true);
                const lore = await getAILore(query);
                setResult(lore);
                setLoading(false);
            };

            return (
                <div className="animate-in fade-in slide-in-from-bottom-6 max-w-md mx-auto pb-10 text-center">
                    <h2 className="text-3xl font-black mb-2 uppercase tracking-tighter">AI Oracle</h2>
                    <p className="text-gray-500 text-xs mb-8 uppercase tracking-[0.2em]">Logical Knowledge Engine</p>
                    <div className="glass rounded-3xl p-6 mb-6">
                        <input className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 mb-4 outline-none focus:border-green-500 text-sm" placeholder="Ask for logical wisdom..." value={query} onChange={e=>setQuery(e.target.value)} />
                        <button onClick={handleAsk} disabled={loading} className="w-full bg-green-500 text-black font-black py-3 rounded-xl disabled:opacity-50">
                            {loading ? "CALCULATING..." : "CONSULT ORACLE"}
                        </button>
                    </div>
                    {result && <div className="glass rounded-3xl p-6 text-sm text-gray-300 leading-relaxed text-left animate-in zoom-in-95">{result}</div>}
                </div>
            );
        }

        function Vault() {
            return (
                <div className="animate-in fade-in slide-in-from-bottom-6 pb-10">
                    <div className="text-center mb-10">
                        <h2 className="text-3xl font-black uppercase tracking-tighter">The Vault</h2>
                        <p className="text-green-500 text-xs font-bold uppercase tracking-widest">Permanent Records</p>
                    </div>
                    
                    <div className="digital-cert rounded-sm">
                        <p className="cert-header">CERTIFICATE OF</p>
                        <h3 className="cert-main-title">ADOPTION</h3>
                        
                        <div className="mb-10 text-sm font-serif italic text-gray-700">
                            This certifies that <div className="cert-line min-w-[180px]"><span className="cert-handwriting">FrogLogic</span></div>
                        </div>
                        
                        <div className="mb-12 text-sm font-serif italic text-gray-700">
                            has officially adopted <div className="cert-line min-w-[220px]"><span className="cert-handwriting">"Derpy Vandals"</span></div>
                        </div>
                        
                        <div className="cert-body-text italic">
                            By signing this certificate, I promise to give them the lifetime of<br/>
                            love, care, and attention that they deserve. I promise to do my<br/>
                            best to protect them and help them live a happy and healthy life.
                        </div>
                        
                        <div className="grid grid-cols-2 gap-12 px-6 mt-16">
                            <div>
                                <span className="cert-handwriting text-xl">FrogLogic</span>
                                <span className="cert-footer-label">SIGNATURE</span>
                            </div>
                            <div>
                                <span className="cert-handwriting text-xl">May 2nd, 2007</span>
                                <span className="cert-footer-label">DATE</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Games() {
            const [score, setScore] = useState(0);
            const [pos, setPos] = useState(null);
            const [active, setActive] = useState(false);
            const start = () => { setScore(0); setActive(true); setPos(Math.floor(Math.random()*9)); setTimeout(() => setActive(false), 20000); };

            return (
                <div className="max-w-xs mx-auto animate-in zoom-in-95">
                    <div className="flex justify-between mb-6 font-black text-green-500 text-sm">
                        <span>FROG CATCH</span>
                        <span>SCORE: {score}</span>
                    </div>
                    <div className="glass p-4 rounded-3xl min-h-[350px] flex flex-col justify-center">
                        {!active ? (
                            <div className="text-center">
                                {score > 0 && <p className="mb-4 text-xl font-black">Score: {score}</p>}
                                <button onClick={start} className="bg-green-500 text-black font-black px-10 py-3 rounded-full shadow-[0_0_20px_rgba(34,197,94,0.3)]">START</button>
                            </div>
                        ) : (
                            <div className="frog-grid">
                                {[...Array(9)].map((_, i) => (
                                    <div key={i} onClick={() => i === pos && (setScore(s=>s+1), setPos(Math.floor(Math.random()*9)))} className={`game-cell ${i === pos ? 'active-frog' : ''}`}>
                                        {i === pos && <span>🐸</span>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
